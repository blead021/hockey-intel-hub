[project]
name = "hockey-intel-pipeline"
version = "0.1.0"
description = "Data ingestion, metrics, models, and sentiment jobs for Hockey Intel Hub"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",   # Postgres driver
  "python-dotenv>=1.0",     # reads the root .env file during local runs
  "httpx>=0.27",            # HTTP client for all API calls
  "feedparser>=6.0",        # reads RSS and Atom news feeds
  "boto3>=1.34",            # writes raw archives to Cloudflare R2 (S3-compatible)
  "anthropic>=1.0",         # Claude API, for reading contract news
  "openpyxl>=3.1",          # reads the starting contracts spreadsheet (.xlsx)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
