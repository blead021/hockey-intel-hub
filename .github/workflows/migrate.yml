# Applies new SQL migrations to the Neon database when /db changes on main.
# Can also be run by hand from the Actions tab.
name: Database migrations

on:
  push:
    branches: [main]
    paths: ["db/**"]
  workflow_dispatch:

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m pipeline.migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
