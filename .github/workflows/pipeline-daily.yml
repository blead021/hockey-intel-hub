# Daily pipeline jobs. Ingestion of games and stats is added in Phase 2.
name: Pipeline daily

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC, after the last West Coast games are final
  workflow_dispatch:

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      R2_BUCKET_RAW: hockey-intel-raw
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Refresh teams
        run: python -m pipeline.ingest.nhl_teams
      - name: Heartbeat
        run: python -m pipeline.heartbeat
