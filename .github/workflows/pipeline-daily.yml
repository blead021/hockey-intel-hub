# Daily pipeline: last night's games, rosters, then a health check.
name: Pipeline daily

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC, after the last West Coast games are final
  workflow_dispatch:

concurrency:
  group: nhl-load
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      ARCHIVE_REQUIRED: "1"
      R2_BUCKET_RAW: hockey-intel-raw
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Load last night's games and current rosters
        run: python -m pipeline.ingest.nightly
      - name: Write undervalued reasons (Claude, about 5 cents)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m pipeline.models.undervalued
      - name: Heartbeat
        if: always()
        run: python -m pipeline.heartbeat
