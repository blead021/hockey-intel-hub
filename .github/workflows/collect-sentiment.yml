# Collects raw sentiment (Reddit, Bluesky, YouTube, news) every 3 hours.
# Every response is saved to R2 first, so the history is kept even if the database is full or down.
name: Collect sentiment

on:
  schedule:
    - cron: "17 */3 * * *" # minute 17 avoids the top-of-hour rush on GitHub's schedulers
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to collect"
        type: choice
        options: [all, news_rss, bluesky, reddit, youtube]
        default: all

concurrency:
  group: collect-sentiment
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      ARCHIVE_REQUIRED: "1"
      R2_BUCKET_RAW: hockey-intel-raw
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Load feeds.csv into the database
        run: python -m pipeline.sentiment.feeds
      - name: Collect
        run: python -m pipeline.sentiment.collect --source "${{ inputs.source || 'all' }}"
      - name: Match mentions to players
        run: python -m pipeline.sentiment.match
      - name: Score with Claude (skips while the sentiment_scoring switch is off)
        run: python -m pipeline.sentiment.score
      - name: Daily sentiment
        run: python -m pipeline.sentiment.aggregate
